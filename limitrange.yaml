apiVersion: v1
kind: LimitRange
metadata: 
  name: limitrange
  namespace: production
spec:
  limits:
    - type: Container
      min:
        cpu: "100m"
        memory: "100Mi"
      max: 
        cpu: "250m"
        memory: "250Mi"
      defaultRequest:
        cpu: "180m"
        memory: "180Mi"
