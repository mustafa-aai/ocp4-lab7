apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-conn
  namespace: database
spec:
  podSelector:
    matchLabels:
      deployment: web-mysql
  ingress:
  - from: 
    - namespaceSelector:
        matchLabels:
          team: devsecops
      ports:
        - port: 3306
          protocol: TCP
  policyTypes:
    - Ingress
  
